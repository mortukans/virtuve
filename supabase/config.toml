# Supabase CLI project config. Only `public` is exposed through PostgREST;
# `private` holds helper functions that must never be callable from the client.
project_id = "virtuve"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "virtuve://"

[edge_runtime]
enabled = true
